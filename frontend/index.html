      <!DOCTYPE html>
      <html lang="es">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Pacific DevOps Music Fest</title>
          <script src="https://cdn.tailwindcss.com"></script>
      </head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-6 text-slate-100">

    <div class="bg-slate-900/50 backdrop-blur-xl border border-white/10 rounded-3xl p-8 max-w-sm w-full shadow-2xl hover:shadow-indigo-500/20 transition-all duration-300">
        <div class="text-5xl mb-4 animate-pulse">🎸</div>
        
        <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-indigo-500">
            Pacific DevOps Music Fest
        </h1>
        <p class="text-slate-400 text-sm mt-2 mb-6">
            Plataforma oficial de control de artistas.
        </p>

        <div class="bg-slate-800/50 rounded-xl p-4 mb-6 border border-white/5">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Infraestructura</span>
                <span id="status-badge" class="text-xs px-2 py-1 rounded-full font-medium bg-slate-950 text-amber-400">Conectando...</span>
            </div>
            
            <div id="api-data" class="space-y-2 text-sm">
                <div class="text-slate-500 animate-pulse text-center">Esperando respuesta de los servicios...</div>
            </div>
        </div>

        <button onclick="verificarConexion()" class="w-full bg-gradient-to-r from-indigo-600 to-cyan-500 hover:opacity-90 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg shadow-indigo-500/30">
            Actualizar Estado
        </button>
    </div>

    <script>
      function verificarConexion() {
        const badge = document.getElementById("status-badge");
        const dataContainer = document.getElementById("api-data");

        badge.innerText = "Consultando...";
        badge.className = "text-xs px-2 py-1 rounded-full font-medium bg-slate-950 text-amber-400";

        fetch("http://192.168.1.18:5000/api/concierto")
          .then((response) => response.json())
          .then((data) => {
            badge.innerText = "🟢 " + (data.estado || "Online");
            badge.className = "text-xs px-2 py-1 rounded-full font-medium bg-emerald-950/30 text-emerald-400 border border-emerald-900";

            dataContainer.innerHTML = `
              <div class="flex justify-between"><span class="text-slate-500">DB:</span> <span class="text-slate-200">💻 ${data.database_status}</span></div>
              <div class="flex justify-between"><span class="text-slate-500">Fecha:</span> <span class="text-slate-200">📅 ${data.fecha}</span></div>
              <div class="mt-4 pt-3 border-t border-white/5 text-center font-semibold text-slate-300">Line-up de Artistas:</div>
              <ul class="mt-2 space-y-1 text-sky-400 text-center text-xs">
                ${data.artistas.map(a => `<li>✨ ${a}</li>`).join('')}
              </ul>
            `;
          })
          .catch(() => {
            badge.innerText = "🔴 Offline";
            badge.className = "text-xs px-2 py-1 rounded-full font-medium bg-red-950/30 text-red-400 border border-red-900";
            dataContainer.innerHTML = '<div class="text-red-400 text-center text-xs italic">Error de conexión inter-PC.</div>';
          });
      }
      window.onload = verificarConexion;
    </script>
</body>
</html>
